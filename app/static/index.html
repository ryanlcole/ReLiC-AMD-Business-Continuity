<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReLiC Business Continuity</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 18px;background:#111;color:#eee}main{background:#1c1c1c;padding:24px;border-radius:16px}label{display:block;margin:14px 0 5px}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #555}button{margin-top:18px;cursor:pointer}pre{white-space:pre-wrap;background:#090909;padding:16px;border-radius:10px;overflow:auto}.status{font-size:.9rem;color:#bbb}</style>
</head>
<body><main><h1>ReLiC Business Continuity</h1><p>Trace a business decision through policy, exception, and correction history.</p><form id="f"><label>Refund amount</label><input id="amount" type="number" min="0.01" step="0.01" value="750" required><label>Customer tier</label><select id="tier"><option>Enterprise Standard</option><option>Enterprise Plus</option><option>Standard</option></select><label><input id="active" type="checkbox"> Enterprise Plus contract active</label><button>Evaluate with ReLiC</button></form><h2>Decision trace</h2><pre id="out">Submit a case to see its decision and evidence identifiers.</pre><p class="status">AMD-backed inference is shown only after an event endpoint is configured and verified.</p></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('out');out.textContent='Evaluating…';try{const r=await fetch('/decision',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({amount:Number(amount.value),customer_tier:tier.value,enterprise_plus_active:active.checked})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(err){out.textContent=String(err)}})</script></body></html>
